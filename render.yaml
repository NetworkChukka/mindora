services:
  - type: web
    name: mindora-exhibition
    env: node
    plan: free
    buildCommand: npm install && cd client && npm install && npm run build
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
